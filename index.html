<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Sports Team Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
        }

        header {
            text-align: center;
            padding: 10px 0;
            background-color: #4CAF50;
            color: white;
            margin-bottom: 20px;
        }

        section {
            margin-bottom: 30px;
            padding: 10px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        input, select {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .results {
            margin-top: 20px;
        }

        .results pre {
            background: #eee;
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <header>
        <h1>Fantasy Sports Team Management</h1>
        <p>Manage your teams, draft players, and track performance!</p>
    </header>

    <section id="team-management">
        <h2>Team Management</h2>
        <form id="create-team-form">
            <label for="team-name">Create a New Team</label>
            <input type="text" id="team-name" placeholder="Enter team name" required>

            <label for="team-description">Describe your team</label>
            <input type="text" id="team-description" placeholder="Enter description here" required>

            <label for="team-status">Add team status</label>
            <input type="text" id="team-status" placeholder="Enter status here" required>
            
            <button type="submit">Create Team</button>
        </form>
        <div class="results" id="team-results"></div>
    </section>

    <section id="player-management">
    <h2>Player Management</h2>

    <form id="create-player-form">
        <h3>Create Player</h3>
        <label for="player-name">Name</label>
        <input type="text" id="player-name" placeholder="Enter player name" required>

        <label for="player-position">Position</label>
        <input type="text" id="player-position" placeholder="Enter position (e.g. Forward)" required>

        <button type="submit">Create Player</button>
    </form>

    <hr>

    <h3>Players List</h3>
    <button id="load-players">Load All Players</button>

    <hr>

    <form id="draft-player-form">
        <h3>Draft Player</h3>
        <label for="draft-player-id">Player ID</label>
        <input type="number" id="draft-player-id" placeholder="Enter player ID" required>

        <label for="draft-team-id">Team ID</label>
        <input type="number" id="draft-team-id" placeholder="Enter team ID" required>

        <button type="submit">Draft Player</button>
    </form>

    <hr>

    <form id="release-player-form">
        <h3>Release Player</h3>
        <label for="release-player-id">Player ID</label>
        <input type="number" id="release-player-id" placeholder="Enter player ID" required>

        <button type="submit">Release Player</button>
    </form>

    <div class="results" id="player-results"></div>
</section>

    <section id="performance-tracking">
        <h2>Performance Tracking</h2>
        <button id="simulate-competition">Simulate Competition</button>
        <div class="results" id="competition-results"></div>
    </section>

    <section id="leaderboard">
        <h2>Leaderboard</h2>
        <button id="view-leaderboard">View Leaderboard</button>
        <div class="results" id="leaderboard-results"></div>
    </section>

    <script>
         const PLAYER_API_BASE = "https://player-service-agdmhzctdvhtapfy.canadacentral-01.azurewebsites.net";

         const PERFORMANCE_API_BASE = "https://performance-service-hdf6dfeccee9c0b3.canadacentral-01.azurewebsites.net";

        
        document.getElementById("create-team-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const teamName = document.getElementById("team-name").value;

            const response = await fetch(`${apiBaseUrl}/teams`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ teamName })
            });

            const result = await response.json();
            document.getElementById("team-results").innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
        });

        function showPlayerResult(text) {
        document.getElementById("player-results").innerHTML =
            `<pre>${text}</pre>`;
    }

   
    document.getElementById("create-player-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = document.getElementById("player-name").value;
        const position = document.getElementById("player-position").value;

        try {
            const response = await fetch(`${PLAYER_API_BASE}/api/Players`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, position })
            });

            if (!response.ok) {
                const err = await response.text();
                showPlayerResult(`ERROR ${response.status}:\n${err}`);
                return;
            }

            const result = await response.json();
            showPlayerResult(JSON.stringify(result, null, 2));
        } catch (err) {
            showPlayerResult(`Network error:\n${err}`);
        }
    });

   
    document.getElementById("load-players").addEventListener("click", async () => {
        try {
            const response = await fetch(`${PLAYER_API_BASE}/api/Players`);

            if (!response.ok) {
                const err = await response.text();
                showPlayerResult(`ERROR ${response.status}:\n${err}`);
                return;
            }

            const result = await response.json();
            renderPlayerList(result);
        } catch (err) {
            showPlayerResult(`Network error:\n${err}`);
        }
    });

    
    document.getElementById("draft-player-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const playerId = document.getElementById("draft-player-id").value;
        const teamId = document.getElementById("draft-team-id").value;

        try {
            const response = await fetch(
                `${PLAYER_API_BASE}/api/Players/${playerId}/draft`,
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ teamId: Number(teamId) }) 
                }
            );

            if (!response.ok) {
                const err = await response.text();
                showPlayerResult(`ERROR ${response.status}:\n${err}`);
                return;
            }

            const result = await response.json();
            renderPlayerList(result);
        } catch (err) {
            showPlayerResult(`Network error:\n${err}`);
        }
    });

   
    document.getElementById("release-player-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const playerId = document.getElementById("release-player-id").value;

        try {
            const response = await fetch(
                `${PLAYER_API_BASE}/api/Players/${playerId}/release`,
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({})   
                }
            );

            if (!response.ok) {
                const err = await response.text();
                showPlayerResult(`ERROR ${response.status}:\n${err}`);
                return;
            }

            const result = await response.json();
            renderPlayerList(result);
        } catch (err) {
            showPlayerResult(`Network error:\n${err}`);
        }
    });

document.getElementById("simulate-competition").addEventListener("click", async () => {
    const playerId = prompt("Enter Player ID to simulate performance for:");
    if (!playerId) return;

    try {
        const response = await fetch(`${PERFORMANCE_API_BASE}/api/performance/simulate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ playerId: Number(playerId) })
        });

        const text = await response.text();
        document.getElementById("competition-results").innerHTML =
            `<pre>${text}</pre>`;
    } catch (err) {
        document.getElementById("competition-results").innerHTML =
            `<pre>Network error:\n${err}</pre>`;
    }
});


        // View leaderboard
        document.getElementById("view-leaderboard").addEventListener("click", async () => {
            const response = await fetch(`${apiBaseUrl}/leaderboard`);
            const result = await response.json();
            document.getElementById("leaderboard-results").innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
        });
        function renderPlayerList(players) {
    if (!Array.isArray(players)) players = [players]; // если пришёл один игрок

    let html = "<ul style='list-style:none; padding:0;'>";

    for (const p of players) {
        html += `
            <li style="
                background:white;
                margin-bottom:10px;
                padding:10px;
                border-radius:6px;
                box-shadow:0 0 5px rgba(0,0,0,0.1);
            ">
                <strong>ID:</strong> ${p.id}<br>
                <strong>Name:</strong> ${p.name}<br>
                <strong>Position:</strong> ${p.position}<br>
                <strong>Status:</strong> ${p.draftStatus}<br>
                <strong>Team ID:</strong> ${p.teamId ?? "None"}
            </li>
        `;
    }

    html += "</ul>";

    document.getElementById("player-results").innerHTML = html;
}

    </script>
</body>
</html>
